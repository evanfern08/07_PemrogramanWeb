<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-btn" aria-label="Menu">&#9776;</button>
        <nav id="nav-menu">

    <main>
        <div class="table-responsive">
            <h2>Daftar Anggota</h2>

            <!-- TUGAS MANDIRI NO 3: Penghitung Jumlah Anggota -->
            <p id="counter-anggota" style="font-weight: bold; margin-bottom: 10px;">
                Menampilkan 0 dari 0 anggota
            </p>

            <!-- PRAKTIKUM HARI INI: Indikator Loading -->
            <div id="loading-indicator-anggota"
                style="display: none; font-style: italic; color: #666; margin-bottom: 10px;">
                Memuat data anggota...
            </div>

            <div class="table-responsive">
                <!-- Kait ID 'tabel-anggota' untuk JavaScript -->
                <table id="tabel-anggota">
                    <thead>
                        <tr>
                            <th>No Anggota</th>
                            <th>Nama</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- KOSONGKAN JUGA DI SINI! Nanti diisi otomatis via fetch() dari data/buku.json -->
                    </tbody>
                </table>
            </div>
    </main>
